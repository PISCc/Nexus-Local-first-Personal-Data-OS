[package]
name = "nexus-core"
version = "0.1.0"
description = "Nexus 本地优先核心边界"
edition = "2021"

[dependencies]
dom_query = "0.27.0"
lopdf = { version = "0.44.0", default-features = false }
nexus-db = { path = "../nexus-db" }
notify = "8.2.0"
quick-xml = "0.41.0"
serde_json = "1.0.151"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[lib]
path = "src/lib.rs"
