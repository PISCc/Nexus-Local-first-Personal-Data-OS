name: Nexus 持续集成

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: nexus-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: 前端检查
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 配置 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 检查格式
        run: pnpm --filter @nexus/desktop run format

      - name: 执行 ESLint
        run: pnpm --filter @nexus/desktop run lint

      - name: 检查 TypeScript
        run: pnpm --filter @nexus/desktop run typecheck

      - name: 执行前端测试
        run: pnpm --filter @nexus/desktop run test

      - name: 构建前端
        run: pnpm --filter @nexus/desktop run build

  rust-core:
    name: Rust 核心检查
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 配置 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 检查 Rust 格式
        run: cargo fmt --all -- --check

      - name: 执行 Rust Clippy
        run: cargo clippy -p nexus-core -p nexus-db --all-targets --all-features -- -D warnings

      - name: 执行 Rust 核心测试
        run: cargo test -p nexus-core -p nexus-db

      - name: 构建 Rust 核心
        run: cargo build -p nexus-core -p nexus-db

  windows-tauri:
    name: Windows Tauri 编译
    runs-on: windows-latest
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 配置 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: 配置 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 构建前端资源
        run: pnpm --filter @nexus/desktop run build

      - name: 编译 Tauri 桌面 crate
        run: cargo build --manifest-path apps/desktop/src-tauri/Cargo.toml
